<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIRAN ZHANG · 完整字母素材库</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark}
    html{background:#000;color:#f4f4f0;font-family:Arial,Helvetica,sans-serif}
    body{margin:0;padding:34px clamp(18px,4vw,64px) 90px}
    header{display:flex;justify-content:space-between;gap:32px;align-items:end;padding-bottom:26px;border-bottom:1px solid #292929}
    h1{margin:0;font-size:clamp(30px,5vw,74px);letter-spacing:-.06em;font-weight:500}
    header p{max-width:540px;margin:0;color:#8e8e89;line-height:1.6;font-size:13px}
    .summary{display:flex;gap:8px;margin-top:18px;color:#777;font:11px/1.4 "Courier New",monospace;text-transform:uppercase;letter-spacing:.08em}
    .summary span{padding:6px 10px;border:1px solid #292929;border-radius:999px}
    .library{display:grid;gap:54px;margin-top:54px}
    .letter-group{display:grid;gap:16px}
    .group-title{display:flex;align-items:baseline;gap:13px;margin:0;font-weight:400}
    .group-title strong{font-size:42px;letter-spacing:-.05em}
    .group-title span{color:#70706c;font:11px/1.4 "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#292929;border:1px solid #292929}
    figure{margin:0;background:#000;min-width:0;padding:18px;display:grid;grid-template-rows:minmax(260px,1fr) auto;gap:16px}
    .stage{min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
    img{display:block;width:100%;height:290px;object-fit:contain}
    figcaption{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #202020;padding-top:12px;color:#d2d2cc;font:11px/1.45 "Courier New",monospace;text-transform:uppercase;letter-spacing:.06em}
    figcaption span:last-child{color:#666;text-align:right;text-transform:none;overflow-wrap:anywhere}
    .back{position:fixed;right:24px;bottom:24px;z-index:3;padding:11px 16px;border:1px solid #3a3a3a;border-radius:999px;background:rgba(5,5,5,.86);color:#eee;text-decoration:none;font-size:12px;backdrop-filter:blur(12px)}
    @media(max-width:820px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}figure{grid-template-rows:minmax(210px,1fr) auto}.stage{min-height:210px}img{height:230px}}
    @media(max-width:520px){body{padding:24px 14px 76px}.library{gap:40px;margin-top:40px}.grid{grid-template-columns:1fr}figure{grid-template-rows:minmax(240px,1fr) auto}.stage{min-height:240px}img{height:260px}}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Letter library</h1>
      <div class="summary"><span>10 positions</span><span id="asset-count">33 assets</span><span>Expanded K / Z / H</span></div>
    </div>
    <p>KIRAN ZHANG 当前首页使用的完整字母素材库。素材按字符位置独立分组，因此两个 A 和两个 N 拥有各自不同的候选方案。</p>
  </header>
  <main id="library" class="library"></main>
  <a class="back" href="./">返回首页</a>
  <script src="config.js?v=20261004-4"></script>
  <script>
    const config=window.LETTER_CONFIG;
    const letters=Array.from(config.text).filter(character=>!/\s/.test(character));
    const library=document.querySelector('#library');
    document.querySelector('#asset-count').textContent=`${config.imagesByPosition.flat().length} assets`;
    letters.forEach((letter,index)=>{
      const section=document.createElement('section');
      section.className='letter-group';
      const title=document.createElement('h2');
      title.className='group-title';
      title.innerHTML=`<strong>${letter}</strong><span>Position ${String(index).padStart(2,'0')}</span>`;
      const grid=document.createElement('div');
      grid.className='grid';
      config.imagesByPosition[index].forEach((filename,variantIndex)=>{
        const variant=String.fromCharCode(65+variantIndex);
        const figure=document.createElement('figure');
        figure.innerHTML=`<div class="stage"><img src="assets/${filename}" alt="${letter} 方案 ${variant}" loading="lazy"></div><figcaption><span>${String(index).padStart(2,'0')} · ${letter} · ${variant}</span><span>${filename}</span></figcaption>`;
        grid.append(figure);
      });
      section.append(title,grid);
      library.append(section);
    });
  </script>
</body>
</html>
